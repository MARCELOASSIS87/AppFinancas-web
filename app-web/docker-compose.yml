services:
  appfinancas-web:
    build:
      context: .
    container_name: appfinancas-web
    restart: always
    networks:
      - root_default
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.appfinancas-web.entrypoints=web,websecure"
      - "traefik.http.routers.appfinancas-web.rule=Host(`webfinancas.locapocos.com.br`)"
      - "traefik.http.routers.appfinancas-web.tls=true"
      - "traefik.http.routers.appfinancas-web.tls.certresolver=mytlschallenge"
      - "traefik.http.services.appfinancas-web.loadbalancer.server.port=80"
      - "traefik.http.middlewares.appfinancas-web-force-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.appfinancas-web-force-https.redirectscheme.permanent=true"
      - "traefik.http.routers.appfinancas-web.middlewares=appfinancas-web-force-https"

networks:
  root_default:
    external: true
